name: Render Short

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "auto (scale pipeline), illusion, physics or all"
        default: "auto"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install numpy pillow
      - name: Render
        run: python shorts.py ${{ github.event.inputs.engine }}
      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "ledger update [skip ci]" || echo "no ledger change"
          git push || echo "push skipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_number }}
          path: out/
